/* ==================== EDITAR O HISTÓRICO ==================== */
function editarMesSal(ano,mes){
  const v=((D.salHist||{})[ano]||{})[mes];
  abrirFolha(`<h2>${MESES[+mes].charAt(0).toUpperCase()+MESES[+mes].slice(1)} de ${ano}</h2>
    <div class="campo"><label>Quanto caiu</label><input id="hVal" type="number" step="0.01" value="${v!==undefined?v:''}"></div>
    <button class="btn verde" onclick="salvarMesSal('${ano}','${mes}')">Salvar</button>
    ${v!==undefined?`<button class="btn claro" style="margin-top:8px" onclick="apagarMesSal('${ano}','${mes}')">Apagar este mês</button>`:''}`);
}
function salvarMesSal(ano,mes){
  const v=numCampo('hVal'); if(!(v>0)) return toast('Informe um valor');
  D.salHist=D.salHist||{}; D.salHist[ano]=D.salHist[ano]||{};
  D.salHist[ano][mes]=v; salvar(); fecharFolha(); render(); toast('Salvo');
}
function apagarMesSal(ano,mes){
  if(D.salHist[ano]) delete D.salHist[ano][mes];
  if(vazio(D.salHist[ano])) delete D.salHist[ano];
  salvar(); fecharFolha(); render();
}
function editarDecimo(ano){
  const d=(D.decimo||{})[ano]||[0,0];
  abrirFolha(`<h2>13º de ${ano}</h2>
    <div class="campo"><label>1ª parcela</label><input id="d1" type="number" step="0.01" value="${d[0]||0}"></div>
    <div class="campo"><label>2ª parcela</label><input id="d2" type="number" step="0.01" value="${d[1]||0}"></div>
    <button class="btn verde" onclick="salvarDecimo('${ano}')">Salvar</button>`);
}
function salvarDecimo(ano){
  D.decimo=D.decimo||{}; D.decimo[ano]=[numCampo('d1'),numCampo('d2')];
  salvar(); fecharFolha(); render(); toast('Salvo');
}
function novoAnoSal(){
  abrirFolha(`<h2>Adicionar ano</h2>
    <div class="campo"><label>Ano</label><input id="nAno" type="number" placeholder="2027"></div>
    <button class="btn verde" onclick="salvarAnoSal()">Criar</button>`);
}
function salvarAnoSal(){
  const a=String(Math.round(numCampo('nAno'))||'');
  if(a.length!==4) return toast('Informe um ano com 4 dígitos');
  D.salHist=D.salHist||{}; if(!D.salHist[a]) D.salHist[a]={};
  UI.ano=a; salvar(); fecharFolha(); render();
}

/* ==================== EDITAR FÉRIAS ==================== */
function editarPeriodo(i){
  const f=D.ferias[i];
  abrirFolha(`<h2>Período ${esc(f.n)}</h2>
    <div class="campo"><label>Nome</label><input id="peN" value="${esc(f.n)}"></div>
    <div class="campo"><label>Início</label><input id="peI" value="${esc(f.ini||'')}" placeholder="set/2025"></div>
    <div class="campo"><label>Fim</label><input id="peF" value="${esc(f.fim||'')}" placeholder="set/2026"></div>
    <div class="campo"><label>Dias do período</label><input id="peD" type="number" value="${f.dias}"></div>
    <div class="campo"><label>Observação</label><input id="peO" value="${esc(f.obs||'')}"></div>
    <div class="campo"><label>Situação</label><select id="peQ">
      <option value="0" ${!f.quit?'selected':''}>Em aberto</option>
      <option value="1" ${f.quit?'selected':''}>Quitado</option></select></div>
    <button class="btn verde" onclick="salvarPeriodo(${i})">Salvar</button>
    <button class="btn claro" style="margin-top:8px" onclick="excluirPeriodo(${i})">Excluir período</button>`);
}
function salvarPeriodo(i){
  const f=D.ferias[i];
  f.n=txtCampo('peN')||f.n; f.ini=txtCampo('peI'); f.fim=txtCampo('peF');
  f.dias=Math.round(numCampo('peD'))||f.dias; f.obs=txtCampo('peO');
  f.quit=(document.getElementById('peQ')||{}).value==='1';
  salvar(); fecharFolha(); render(); toast('Salvo');
}
function excluirPeriodo(i){
  if(!confirm('Excluir o período "'+D.ferias[i].n+'" e tudo que está registrado nele?')) return;
  D.ferias.splice(i,1); salvar(); fecharFolha(); render();
}
function novoPeriodo(){
  D.ferias=D.ferias||[];
  D.ferias.push({n:'novo período',ini:'',fim:'',dias:30,gozos:[]});
  salvar(); render(); editarPeriodo(D.ferias.length-1);
}
function editarGozo(i,j){
  const g=D.ferias[i].gozos[j];
  abrirFolha(`<h2>${g.vend?'Dias vendidos':'Dias tirados'}</h2>
    <div class="campo"><label>Quantos dias</label><input id="gzD" type="number" value="${g.d}"></div>
    <div class="campo"><label>O que fez</label><select id="gzT">
      <option value="tirou" ${!g.vend?'selected':''}>Tirei de férias</option>
      <option value="vendeu" ${g.vend?'selected':''}>Vendi</option></select></div>
    <div class="campo"><label>Valor recebido</label><input id="gzV" type="number" step="0.01" value="${g.v||0}"></div>
    <div class="campo"><label>De</label><input id="gzDe" value="${esc(g.de||'')}" placeholder="06/10"></div>
    <div class="campo"><label>Até</label><input id="gzAte" value="${esc(g.ate||'')}" placeholder="16/10/2026"></div>
    <div class="campo"><label>Recebido em</label><input id="gzRec" value="${esc(g.rec||'')}" placeholder="out/2026"></div>
    <button class="btn verde" onclick="salvarGozo(${i},${j})">Salvar</button>
    <button class="btn claro" style="margin-top:8px" onclick="excluirGozo(${i},${j})">Excluir registro</button>`);
}
function salvarGozo(i,j){
  const g=D.ferias[i].gozos[j];
  g.d=Math.round(numCampo('gzD'))||g.d;
  g.vend=(document.getElementById('gzT')||{}).value==='vendeu';
  g.v=numCampo('gzV');
  g.de=txtCampo('gzDe'); g.ate=txtCampo('gzAte'); g.rec=txtCampo('gzRec');
  salvar(); fecharFolha(); render(); toast('Salvo');
}
function excluirGozo(i,j){
  D.ferias[i].gozos.splice(j,1); salvar(); fecharFolha(); render();
}

/* ==================== EDITAR DÍVIDAS ==================== */
function editarEmprestimo(id){
  const f=(D.fixas||[]).find(x=>x.id===id); if(!f) return;
  abrirFolha(`<h2>${esc(f.nome)}</h2>
    <div class="campo"><label>Nome</label><input id="emN" value="${esc(f.nome)}"></div>
    <div class="campo"><label>Valor da parcela</label><input id="emV" type="number" step="0.01" value="${f.valor}"></div>
    <div class="campo"><label>Quantas parcelas no total</label><input id="emP" type="number" value="${f.parcelas}"></div>
    <div class="campo"><label>Primeira parcela em (ano-mês)</label><input id="emI" value="${esc(f.inicio||'')}" placeholder="2026-08"></div>
    <div class="campo"><label>Vence dia</label><input id="emD" type="number" min="1" max="31" value="${f.dia}"></div>
    <div class="campo"><label>Como se paga</label><select id="emF">
      ${['boleto','pix','debito','dinheiro'].map(o=>`<option value="${o}" ${o===f.forma?'selected':''}>${FORMAS[o]}</option>`).join('')}</select></div>
    <button class="btn verde" onclick="salvarEmprestimo(${id})">Salvar</button>
    <button class="btn claro" style="margin-top:8px" onclick="excluirFixa(${id})">Excluir</button>`);
}
function salvarEmprestimo(id){
  const f=D.fixas.find(x=>x.id===id); if(!f) return;
  f.nome=txtCampo('emN')||f.nome; f.valor=numCampo('emV');
  f.parcelas=Math.round(numCampo('emP'))||f.parcelas;
  const ini=txtCampo('emI'); if(/^\d{4}-\d{2}$/.test(ini)) f.inicio=ini;
  f.dia=Math.min(31,Math.max(1,Math.round(numCampo('emD'))||f.dia));
  f.forma=(document.getElementById('emF')||{}).value||f.forma;
  salvar(); fecharFolha(); render(); toast('Salvo');
}
function excluirFixa(id){
  const f=D.fixas.find(x=>x.id===id); if(!f) return;
  if(!confirm('Excluir "'+f.nome+'"?')) return;
  D.fixas=D.fixas.filter(x=>x.id!==id); salvar(); fecharFolha(); render();
}
function novaDivida(){
  const f={id:novoId(),nome:'nova dívida',valor:0,forma:'boleto',dia:10,cat:'Dívidas',
    inicio:UI.mesRef,ativa:true,ajustes:{},tipo:'divida',parcelas:12};
  D.fixas.push(f); salvar(); render(); editarEmprestimo(f.id);
}
function editarParcelado(id){
  const g=D.gastos.find(x=>x.id===id); if(!g) return;
  abrirFolha(`<h2>${esc(g.desc)}</h2>
    <div class="campo"><label>Descrição</label><input id="pcN" value="${esc(g.desc)}"></div>
    <div class="campo"><label>Valor total</label><input id="pcV" type="number" step="0.01" value="${g.valor}"></div>
    <div class="campo"><label>Em quantas vezes</label><input id="pcP" type="number" value="${g.parcelas}"></div>
    <div class="campo"><label>Primeira parcela no ciclo (ano-mês)</label><input id="pcI" value="${esc(g.cicloInicial||cicloDe(g))}"></div>
    <div class="campo"><label>Cartão</label><select id="pcC">
      ${CARTOES().map(c=>`<option value="${c.id}" ${c.id===g.card?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div class="campo"><label>Categoria</label><select id="pcCat">
      ${D.catsGasto.map(c=>`<option ${c===g.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <button class="btn verde" onclick="salvarParcelado(${id})">Salvar</button>
    <button class="btn claro" style="margin-top:8px" onclick="excluirParcelado(${id})">Excluir</button>`);
}
function salvarParcelado(id){
  const g=D.gastos.find(x=>x.id===id); if(!g) return;
  g.desc=txtCampo('pcN')||g.desc; g.valor=numCampo('pcV');
  g.parcelas=Math.round(numCampo('pcP'))||g.parcelas;
  const ini=txtCampo('pcI'); if(/^\d{4}-\d{2}$/.test(ini)) g.cicloInicial=ini;
  g.card=(document.getElementById('pcC')||{}).value||g.card;
  g.cat=(document.getElementById('pcCat')||{}).value||g.cat;
  salvar(); fecharFolha(); render(); toast('Salvo');
}
function excluirParcelado(id){
  const g=D.gastos.find(x=>x.id===id);
  if(!g || !confirm('Excluir "'+g.desc+'" e todas as parcelas?')) return;
  D.gastos=D.gastos.filter(x=>x.id!==id); salvar(); fecharFolha(); render();
}
